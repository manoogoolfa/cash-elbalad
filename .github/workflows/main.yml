name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'

      - name: Generate and Build APK
        run: |
          flutter create temp_project --org com.cashelbalad
          rm -rf temp_project/lib
          cp -r lib temp_project/
          cp pubspec.yaml temp_project/
          
          # Adjust minSdkVersion for compatibility
          sed -i 's/minSdkVersion.*/minSdkVersion 21/' temp_project/android/app/build.gradle
          
          cd temp_project
          flutter pub get
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: temp_project/build/app/outputs/flutter-apk/app-debug.apk
